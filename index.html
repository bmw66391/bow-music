<title>Bow 的怀旧金曲</title>
<style>
:root{
  --bg:#171008; --bg2:#221709; --card:#241a0e; --card2:#2c2110;
  --gold:#d9a441; --gold2:#f2c66d; --cream:#f3e7cf; --muted:#b9a27e;
  --line:rgba(217,164,65,.22); --red:#c0392b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  background:
    radial-gradient(1200px 600px at 50% -120px, rgba(217,164,65,.10), transparent 60%),
    var(--bg);
  color:var(--cream); min-height:100vh;
}
/* 顶部 */
header{ text-align:center; padding:44px 20px 10px; position:relative; overflow:hidden;}
.vinyl{
  width:118px;height:118px;margin:0 auto 18px;border-radius:50%;
  background:
    radial-gradient(circle at center, var(--gold) 0 16%, #8a5a1d 16% 18%, #111 18% 100%),
    repeating-radial-gradient(circle at center, #1c1c1c 0 2px, #262626 2px 4px);
  background-blend-mode:normal;
  box-shadow:0 0 0 6px rgba(217,164,65,.15), 0 10px 40px rgba(0,0,0,.6);
  animation:spin 9s linear infinite; position:relative;
}
.vinyl::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  background:repeating-radial-gradient(circle at center, transparent 0 3px, rgba(255,255,255,.045) 3px 4px);
}
.vinyl::before{
  content:""; position:absolute; left:50%; top:50%; width:10px; height:10px;
  background:var(--cream); border-radius:50%; transform:translate(-50%,-50%); z-index:2;
}
@keyframes spin{to{transform:rotate(360deg);}}
h1{font-size:30px; letter-spacing:.35em; text-indent:.35em; margin:6px 0 8px; color:var(--gold2); font-weight:600;}
.sub{color:var(--muted); font-size:14px; letter-spacing:.2em;}
.stats{margin-top:14px; font-size:13px; color:var(--muted); letter-spacing:.1em;}
.stats b{color:var(--gold2); font-size:16px; margin:0 4px;}
/* 筛选 */
.filters{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  padding:22px 16px 6px; position:sticky; top:0; z-index:5;
  background:linear-gradient(to bottom, var(--bg) 78%, transparent);
}
.searchbox{max-width:420px; margin:10px auto 0; padding:0 16px;}
.searchbox input{
  width:100%; font-family:inherit; font-size:15px; color:var(--cream);
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:10px 20px; outline:none;
}
.searchbox input:focus{border-color:var(--gold);}
.searchbox input::placeholder{color:var(--muted);}
.filters button{
  font-family:inherit; font-size:14px; letter-spacing:.15em;
  padding:9px 18px; border-radius:999px; cursor:pointer;  background:transparent; color:var(--muted);
  border:1px solid var(--line); transition:all .25s;
}
.filters button:hover{color:var(--cream); border-color:var(--gold);}
.filters button.active{background:var(--gold); color:#1d1206; border-color:var(--gold); font-weight:600;}
/* 列表 */
.grid{
  display:grid; gap:16px; padding:18px 16px 60px;
  max-width:1080px; margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
}
/* 卡片 */
.card{
  background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid var(--line); border-radius:14px;
  padding:18px 18px 16px; position:relative;
  transition:transform .25s, box-shadow .25s, opacity .3s;
  display:flex; flex-direction:column; gap:10px;
}
.card:hover{transform:translateY(-3px); box-shadow:0 12px 32px rgba(0,0,0,.45); border-color:rgba(217,164,65,.45);}
.card.listened{opacity:.45;}
.card.listened .title{text-decoration:line-through; text-decoration-color:var(--gold);}
.tag{
  align-self:flex-start; font-size:12px; letter-spacing:.2em;
  color:var(--gold2); border:1px solid var(--line);
  padding:4px 12px; border-radius:999px; background:rgba(217,164,65,.08);
}
.title{font-size:20px; font-weight:600; color:var(--cream); line-height:1.4; margin:0;}
.artist{font-size:14px; color:var(--muted); letter-spacing:.1em; margin:0;}
.note{
  font-size:14px; line-height:1.7; color:#d8c9a8; margin:0;
  border-left:2px solid var(--gold); padding-left:12px; font-style:normal;
}
.actions{display:flex; gap:10px; margin-top:auto; padding-top:6px;}
.embed{margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--line);}
.embed iframe{display:block;}
.btn{
  font-family:inherit; flex:1; font-size:14px; letter-spacing:.12em;
  padding:10px 0; border-radius:10px; cursor:pointer; text-align:center;
  text-decoration:none; transition:all .25s; border:1px solid var(--line);
}
.play{background:var(--gold); color:#1d1206; border-color:var(--gold); font-weight:600;}
.play:hover{background:var(--gold2);}
.play.big{flex:none; padding:12px 32px; font-size:16px; border-radius:999px;}
.btn.big{flex:none; padding:12px 32px; font-size:16px; border-radius:999px; text-decoration:none; display:inline-block;}
.shuffle{background:#7b2ff7; color:#fff; border:1px solid #7b2ff7; font-weight:600;}
.shuffle:hover{background:#9350ff;}
.listen{background:transparent; color:var(--muted);}
.listen:hover{color:var(--cream); border-color:var(--gold);}
.app{background:#1db954; color:#fff; border-color:#1db954; font-weight:600; flex:1; display:flex; align-items:center; justify-content:center;}
.app:hover{background:#1ed760;}
.yt{background:#c4302b; color:#fff; border-color:#c4302b; font-weight:600;}
.yt:hover{background:#e04038;}
.card.listened .listen{color:var(--gold2); border-color:var(--gold);}
.check{
  position:absolute; top:12px; right:14px; font-size:20px; color:var(--gold2);
  display:none;
}
.card.listened .check{display:block;}
/* 空态 / 加载 */
.state{grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 0; letter-spacing:.2em;}
footer{text-align:center; color:var(--muted); font-size:12px; letter-spacing:.25em; padding:0 20px 44px;}
@media (max-width:640px){
  h1{font-size:24px;}
  .vinyl{width:92px;height:92px;}
  .filters{top:0;}
  .grid{grid-template-columns:1fr; padding:14px 14px 50px;}
}
</style>
</head>

<script>
function spSearch(){
  const q = document.getElementById("searchInput").value.trim();
  if(q) window.open("https://open.spotify.com/search/" + encodeURIComponent(q), "_blank");
}
function ytSearch(){
  const q = document.getElementById("searchInput").value.trim();
  if(q) window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), "_blank");
}
let itunesResults = [];
const YT_API_KEY = "AIzaSyD8rBC7nGCsCUE47xD5gIdqWsCWM8N0mos";
// 全局：停掉所有正在播的（互斥播放）
function stopAllPlayers(){
  document.querySelectorAll("audio").forEach(a => { try{ a.pause(); }catch(e){} });
  document.querySelectorAll("#grid .embed").forEach(e => e.remove());
  const pb = document.getElementById("playlistBox");
  if(pb){ pb.style.display = "none"; pb.innerHTML = ""; }
  if(typeof itunesResults !== "undefined"){
    itunesResults.forEach((_,j) => { const el = document.getElementById("srplay"+j); if(el) el.innerHTML = ""; });
  }
  try{ playingId = null; playingYtId = null; playlistOpen = false; }catch(e){}
  document.querySelectorAll(".btn.play").forEach(b => { if(b.textContent.includes("试听")) b.textContent = "▶ 试听30秒"; });
  document.querySelectorAll(".btn.yt").forEach(b => { if(b.textContent.includes("收起")) b.textContent = "▶ YouTube播"; });
}
window.stopAllPlayers = stopAllPlayers;
async function itunesSearch(){
  const q = document.getElementById("searchInput").value.trim();
  if(!q) return;
  grid.innerHTML = '<div class="state">正在搜索全网… ♪</div>';
  try{
    const r = await fetch("https://itunes.apple.com/search?term=" + encodeURIComponent(q) + "&media=music&entity=song&limit=20&country=US");
    const d = await r.json();
    itunesResults = d.results || [];
    if(!itunesResults.length){ grid.innerHTML = '<div class="state">没搜到相关歌曲，换个关键词试试 ♪</div>'; return; }
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:8px; letter-spacing:.1em;">全网搜索 “${esc(q)}” · ${itunesResults.length} 个结果 ♪</div>` + itunesResults.map((t,i) => `
      <article class="card">
        <span class="tag">全网</span>
        <h2 class="title">${esc(t.trackName||"")}</h2>
        <p class="artist">${esc(t.artistName||"")}</p>
        <p class="note">${esc(t.collectionName||"")}</p>
        <div style="margin:10px 0;"><img src="${(t.artworkUrl100||"").replace("100x100","200x200")}" style="width:100px;height:100px;border-radius:12px;" loading="lazy"></div>
        <div class="actions">
          <button class="btn play" onclick="playPreview(${i}, this)">▶ 试听30秒</button>
          <button class="btn yt" onclick="ytPlaySearch(${i}, this)">▶ YouTube播</button>
        </div>
        <div id="srplay${i}"></div>
      </article>`).join("");
  }catch(e){
    grid.innerHTML = '<div class="state">搜索失败，请检查网络后重试 ♪</div>';
  }
}
let currentPreviewAudio = null;
let currentPreviewBtn = null;
function playPreview(i, btn){
  const t = itunesResults[i];
  if(!t || !t.previewUrl) return;
  const box = document.getElementById("srplay"+i);
  // 如果已经在播这首，则收起
  if(box.querySelector("audio")){ box.innerHTML = ""; btn.textContent = "▶ 试听30秒"; currentPreviewAudio = null; currentPreviewBtn = null; return; }
  stopAllPlayers();
  // 收起 YouTube 嵌入
  box.innerHTML = `<audio controls preload="none" src="${t.previewUrl}" style="width:100%; margin-top:8px;"></audio>`;
  const audio = box.querySelector("audio");
  currentPreviewAudio = audio;
  currentPreviewBtn = btn;
  btn.textContent = "⏸ 收起试听";
  audio.onended = () => { btn.textContent = "▶ 试听30秒"; currentPreviewAudio = null; currentPreviewBtn = null; };
  // 锁屏/后台播放信息
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.trackName || "", artist: t.artistName || "", album: t.collectionName || ""
      });
    }catch(e){}
  }
  audio.play().catch(() => {});
}
let currentYtSearchFrame = null;
async function ytPlaySearch(i, btn){
  const t = itunesResults[i];
  if(!t) return;
  const box = document.getElementById("srplay"+i);
  if(box.querySelector("iframe")){ box.innerHTML = ""; btn.textContent = "▶ YouTube播"; return; }
  stopAllPlayers();
  btn.textContent = "搜索中…";
  try{
    const q = encodeURIComponent((t.trackName||"") + " " + (t.artistName||""));
    const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&videoEmbeddable=true&q=${q}&key=${YT_API_KEY}`);
    const d = await r.json();
    const vid = d.items && d.items[0] && d.items[0].id && d.items[0].id.videoId;
    if(!vid) throw new Error("no video");
    box.innerHTML = `<div class="embed"><iframe src="https://www.youtube.com/embed/${vid}?rel=0" width="100%" height="220" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
    btn.textContent = "⏸ 收起";
  }catch(e){
    btn.textContent = "▶ YouTube播";
    box.innerHTML = '<div class="state">没找到可播视频，换一首试试 ♪</div>';
  }
}
</script>

];

/* 听过状态：localStorage 持久化 */
const LS_KEY = "bow-music-listened";
function loadListened(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const arr = JSON.parse(raw || "[]");
    return new Set(Array.isArray(arr) ? arr : []);
  }catch(e){ return new Set(); }
}
function saveListened(set){
  try{ localStorage.setItem(LS_KEY, JSON.stringify([...set])); }catch(e){}
}

let songs = SONGS.map(s => ({...s, is_listened:false}));
let cur = "all";
let query = "";
let searchTimer = null;
function onSearchInput(v){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = v.trim().toLowerCase(); render(); }, 300);
}
function onSearch(v){ query = v.trim().toLowerCase(); render(); }
window.onSearch = onSearch;
window.onSearchInput = onSearchInput;

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const statsEl = document.getElementById("stats");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderFilters(){
  filtersEl.innerHTML = Object.keys(CATS).map(k =>
    `<button data-cat="${k}" class="${k===cur?"active":""}" onclick="setFilter('${k}')">${CATS[k]}</button>`
  ).join("");
}
function setFilter(k){ cur = k; renderFilters(); render(); }
window.setFilter = setFilter;

function toggleListen(id){
  const listened = loadListened();
  if(listened.has(id)) listened.delete(id); else listened.add(id);
  saveListened(listened);
  songs = songs.map(s => s.id===id ? {...s, is_listened:listened.has(id)} : s);
  render();
}
window.toggleListen = toggleListen;

function trackId(url){
  const m = String(url||"").match(/\/track\/([A-Za-z0-9]+)/);
  return m ? m[1] : "";
}
let playingId = null;
let playingYtId = null;
let playlistOpen = false;
let lastList = [];
let ytQueue = [];
function togglePlay(id){
  const willPlay = (playingId !== id);
  stopAllPlayers();
  playingId = willPlay ? id : null;
  render();
}
window.togglePlay = togglePlay;
function toggleYt(id){
  const willPlay = (playingYtId !== id);
  stopAllPlayers();
  if(willPlay){
    // 组连播队列：从点的这首开始，后续有 YouTube 的歌排队，播完循环
    const withYt = lastList.filter(s => s.youtube_id);
    const startIdx = withYt.findIndex(s => s.id === id);
    ytQueue = startIdx >= 0 ? withYt.slice(startIdx).concat(withYt.slice(0, startIdx)) : withYt;
    playingYtId = id;
  } else {
    playingYtId = null;
    ytQueue = [];
  }
  render();
}
window.toggleYt = toggleYt;
function togglePlaylist(){
  const wasOpen = playlistOpen;
  stopAllPlayers();
  if(!wasOpen){
    playlistOpen = true;
    const box = document.getElementById("playlistBox");
    box.style.display = "block";
    box.innerHTML = `<iframe src="https://open.spotify.com/embed/playlist/1BynA5iOpdiAnm54f0GBpQ?utm_source=generator&theme=0" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  }
  render();
}
window.togglePlaylist = togglePlaylist;

function render(){
  // 渲染前停掉可能还在播的 audio（比如从搜索结果切回时）
  document.querySelectorAll("audio").forEach(a => { try{ a.pause(); }catch(e){} });
  const list = songs.filter(s =>
    (cur==="all" || s.category===cur) &&
    (!query || s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query))
  );
  lastList = list;
  const done = songs.filter(s=>s.is_listened).length;
  statsEl.innerHTML = `共 <b>${songs.length}</b> 首 · 已听 <b>${done}</b> 首`;
  if(!list.length){
    if(query && typeof itunesSearch === "function"){ itunesSearch(); return; }
    grid.innerHTML = '<div class="state">这里还没有歌曲，明天再来听听 ♪</div>'; return;
  }
  grid.innerHTML = list.map(s => {
    const tid = trackId(s.spotify_url);
    const isPlaying = playingId === s.id;
    const isYtPlaying = playingYtId === s.id;    return `
    <article class="card ${s.is_listened?"listened":""}">
      <span class="check">✓</span>
      <span class="tag">${esc(CATS[s.category]||s.category)}</span>
      <h2 class="title">${esc(s.title)}</h2>
      <p class="artist">${esc(s.artist)}</p>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      <div class="actions">
        <button class="btn play" onclick="togglePlay(${s.id})">${isPlaying?"⏸ 收起":"▶ Spotify播"}</button>
        ${s.youtube_id ? `<button class="btn yt" onclick="toggleYt(${s.id})">${isYtPlaying?"⏸ 收起":"▶ YouTube播"}</button>` : ""}
        ${tid ? `<a class="btn app" href="spotify:track:${tid}">🎧 App</a>` : ""}
        <button class="btn listen" onclick="toggleListen(${s.id})">${s.is_listened?"已听过":"标记听过"}</button>
      </div>
      ${isPlaying && tid ? `<div class="embed"><iframe src="https://open.spotify.com/embed/track/${tid}?utm_source=generator&theme=0" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>` : ""}
      ${isYtPlaying && s.youtube_id ? `<div class="embed"><iframe src="https://www.youtube.com/embed/${s.youtube_id}?playlist=${ytQueue.slice(1).map(q=>q.youtube_id).join(",")}&rel=0&loop=1&autoplay=1" width="100%" height="220" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div><div style="text-align:center;color:var(--muted);font-size:12px;padding:4px;">播完自动下一首 · 共 ${ytQueue.length} 首连播</div>` : ""}
    </article>`;}).join("");
}

(function init(){
  const listened = loadListened();
  songs = songs.map(s => ({...s, is_listened:listened.has(s.id)}));
  renderFilters();
  render();
})();
</script>
</body>
</html>
